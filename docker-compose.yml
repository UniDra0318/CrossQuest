services:
  postgres:
    image: postgres:16-alpine
    container_name: crossquest-postgres
    restart: always
    environment:
      POSTGRES_USER: crossquest_admin
      POSTGRES_PASSWORD: crossquest_secret_password
      POSTGRES_DB: crossquest_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crossquest_admin -d crossquest_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crossquest-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://crossquest_admin:crossquest_secret_password@postgres:5432/crossquest_db
      SECRET_KEY: supersecretjwtkeyforcrossquestplatformchangeinproduction
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crossquest-frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  postgres_data:
