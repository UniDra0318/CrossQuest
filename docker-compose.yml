services:
  postgres:
    image: postgres:16-alpine
    container_name: crossquest-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crossquest_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crossquest_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-crossquest_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crossquest_admin} -d ${POSTGRES_DB:-crossquest_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crossquest-backend
    restart: always
    # NOTE: Default values are intended strictly for local development/testing.
    # In production, pass secure non-default secrets via environment variables or a .env file.
    environment:
      # Connect as runtime unprivileged role (crossquest_app) so PostgreSQL Row-Level Security (RLS) is strictly enforced
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_APP_USER:-crossquest_app}:${POSTGRES_APP_PASSWORD:-app_secure_password}@postgres:5432/${POSTGRES_DB:-crossquest_db}}
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-crossquest_admin}:${POSTGRES_PASSWORD:-crossquest_secret_password}@postgres:5432/${POSTGRES_DB:-crossquest_db}}
      SECRET_KEY: ${SECRET_KEY:-supersecretjwtkeyforcrossquestplatformchangeinproduction}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10}
      CONTEXT_SIGNING_SECRET: ${CONTEXT_SIGNING_SECRET:-crossquest_internal_context_signing_secret_key_change_in_prod}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://localstack:4566}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-southeast-1}
      DB_SSL_MODE: ${DB_SSL_MODE:-prefer}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  localstack:
    image: localstack/localstack:latest
    container_name: crossquest-localstack
    restart: always
    ports:
      - "4566:4566"
    environment:
      - SERVICES=kms,secretsmanager
      - DEFAULT_REGION=ap-southeast-1


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crossquest-frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  postgres_data:
